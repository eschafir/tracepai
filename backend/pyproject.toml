[project]
name = "tracepai"
version = "0.1.0"
description = "TracepAI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.0",
    "pwdlib[argon2]>=0.3.1",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.47",
    "supabase>=2.10.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not ocr'"
markers = ["ocr: runs the real Tesseract (needs it installed; run with -m ocr)"]
